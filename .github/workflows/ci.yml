name: CI

on:
  push:
    branches: [main]
  # No branches filter: stacked PRs (one feature branch based on another,
  # rather than on main) need CI too, not just PRs that target main directly.
  pull_request:

# A new push to the same branch makes the in-flight run obsolete.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint and format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check

  test:
    name: Test on Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      # Node exits non-zero when a threshold is missed, so the coverage flags
      # are the gate. No extra tooling, no separate reporting step to keep in
      # sync with the numbers.
      #
      # The harness generates its own credentials when these are unset, so
      # nothing has to be written down here. NODE_ENV alone is enough.
      - name: Test with coverage gate
        env:
          NODE_ENV: test
        run: |
          mkdir -p coverage
          node --test \
            --experimental-test-coverage \
            --test-coverage-exclude="tests/**" \
            --test-coverage-lines=90 \
            --test-coverage-branches=75 \
            --test-reporter=spec --test-reporter-destination=stdout \
            --test-reporter=lcov --test-reporter-destination=coverage/lcov.info \
            "tests/**/*.test.js"

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-node-${{ matrix.node }}
          path: coverage/lcov.info
          if-no-files-found: warn

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
